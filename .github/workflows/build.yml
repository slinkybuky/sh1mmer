
name: Build SH1MMER Images

on:
  workflow_dispatch:
    inputs:
      boards:
        description: "Boards to build: all, or comma-separated board names"
        required: true
        default: "all"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Select boards
        id: set-matrix
        env:
          BOARDS: ${{ inputs.boards }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BOARDS" == "all" || -z "$BOARDS" ]]; then
            matrix='{"board":["dedede","octopus","coral","grunt","nissa","zork"]}'
          else
            IFS=',' read -ra requested <<< "$BOARDS"
            selected=()

            for board in "${requested[@]}"; do
              board="$(printf '%s' "$board" | xargs)"

              case "$board" in
                dedede|octopus|coral|grunt|nissa|zork)
                  if [[ ! " ${selected[*]} " =~ " ${board} " ]]; then
                    selected+=("$board")
                  fi
                  ;;
                *)
                  echo "::error::Invalid board: $board"
                  exit 1
                  ;;
              esac
            done

            if [[ ${#selected[@]} -eq 0 ]]; then
              echo "::error::No boards selected"
              exit 1
            fi

            matrix="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs '{board: .}')"
          fi

          echo "Selected matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file pv jq

      - name: Download and extract firmware
        env:
          BOARD: ${{ matrix.board }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p inputs results
          zip_file="$RUNNER_TEMP/${BOARD}.zip"
          extract_dir="$RUNNER_TEMP/${BOARD}"

          curl -fL --retry 3 --retry-delay 2 \
            -o "$zip_file" \
            "https://dl.cros.download/files/${BOARD}/${BOARD}.zip"

          mkdir -p "$extract_dir"
          unzip -o "$zip_file" -d "$extract_dir" >/dev/null

          asset="$(find "$extract_dir" -type f -name '*.bin' -print -quit)"

          if [[ -z "$asset" ]]; then
            echo "::error::No .bin image found for ${BOARD}"
            exit 1
          fi

          cp "$asset" "inputs/${BOARD}-original.bin"
          cp "inputs/${BOARD}-original.bin" "inputs/${BOARD}.bin"

          echo "Original image:"
          ls -lh "inputs/${BOARD}-original.bin"

          echo "Working image:"
          ls -lh "inputs/${BOARD}.bin"

      - name: Patch image with wax
        env:
          BOARD: ${{ matrix.board }}
        shell: bash
        run: |
          set -euo pipefail

          sudo bash wax/wax.sh -i "inputs/${BOARD}.bin"

          if [[ ! -s "inputs/${BOARD}.bin" ]]; then
            echo "::error::Wax did not produce a non-empty patched image"
            exit 1
          fi

          if cmp -s "inputs/${BOARD}-original.bin" "inputs/${BOARD}.bin"; then
            echo "::error::The image is unchanged after running wax"
            exit 1
          fi

          cp "inputs/${BOARD}.bin" "results/${BOARD}-sh1mmer.bin"

          echo "Patched image:"
          file "results/${BOARD}-sh1mmer.bin"
          ls -lh "results/${BOARD}-sh1mmer.bin"

      - name: Upload patched image
        uses: actions/upload-artifact@v4
        with:
          name: sh1mmer-${{ matrix.board }}
          path: results/${{ matrix.board }}-sh1mmer.bin
          if-no-files-found: error
          retention-days: 14
