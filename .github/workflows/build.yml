name: Run command and upload results

on:
  push:
    branches: [beautifulworld]
  pull_request:
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run command
        run: sudo bash /wax/wax.sh
        # working-directory defaults to the repo root

      - name: Upload results
        if: always()   # upload even if the command fails
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          if-no-files-found: warn
          retention-days: 14
